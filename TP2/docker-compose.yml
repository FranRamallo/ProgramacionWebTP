services:
  api:
    build: ./api
    container_name: go-api
    ports:
      -"8080:8080"
    environment:
      - DB_HOST=${DATABASE_HOST}
      - DB_PORT=${DATABASE_PORT}
      - DB_USER=${DATABASE_USER}
      - DB_PASSWORD=${DATABASE_PASSWORD}
      - DB_NAME=${DATABASE_NAME}
    depends_on:
      - database
    volumes:
      - pgdata:/var/lib/postgresql/data